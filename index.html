<!-- ... existing code ... -->
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-4 border-b border-lga-gold/30">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider text-lga-goldDark">Verified Tour Scorecards</span>
                            <h3 id="breakdown-title" class="font-serif text-xl font-bold text-lga-navy">2025 LGA Championship</h3>
                            <p id="breakdown-location-subtitle" class="text-xs text-lga-slate mt-0.5 hidden"></p>
                        </div>
                        <div id="year-selector-pills" class="flex items-center gap-1.5 flex-wrap">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                    <div id="year-breakdown-content" class="mt-4">
                        <!-- Populated via JS -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
// ... existing code ...
                    const payload = {
                        app: 'LGA Score & Handicap Tracker',
                        exportedAt: new Date().toISOString(),
                        activeGolfer,
                        tourYears,
                        rounds,
                        customCourses,
                        historyMatrix,
                        handicapHistory,
                        manualWhsOverrides
                    };
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `lga-tracker-backup-${new Date().toISOString().slice(0, 10)}.json`;
                    link.click();
                    URL.revokeObjectURL(url);
                    showToast('Backup JSON downloaded.');
                } catch (err) {
                    console.error('Export backup failed:', err);
                    showToast('Could not export backup.');
                }
            };

            window.importBackupJson = function(event) {
                const file = event?.target?.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(String(e.target?.result || '{}'));
                        if (typeof data.activeGolfer === 'string' && data.activeGolfer.trim()) {
                            activeGolfer = normalizePlayerName(data.activeGolfer);
                        }
                        if (Array.isArray(data.rounds)) rounds = data.rounds;
                        if (Array.isArray(data.customCourses)) customCourses = data.customCourses;
                        if (Array.isArray(data.tourYears) && data.tourYears.length > 0) {
                            tourYears = DEFAULT_TOUR_YEARS.map(def => {
                                const match = data.tourYears.find(item => String(item.year) === def.year);
                                return {
                                    year: def.year,
                                    venue: match && typeof match.venue === 'string' ? match.venue.trim() : ''
                                };
                            });
                        }
                        if (Array.isArray(data.historyMatrix)) historyMatrix = mergeHistoryRows(data.historyMatrix);
                        if (data.handicapHistory) handicapHistory = data.handicapHistory;
                        if (data.manualWhsOverrides) manualWhsOverrides = data.manualWhsOverrides;

                        recalculateWHS();
                        populateCourseDropdowns();
                        renderAll();
                        pushSharedStateToCloud();
                        showToast('Backup restored successfully.');
                    } catch (err) {
                        console.error('Import backup failed:', err);
                        showToast('Invalid backup file.');
                    } finally {
                        if (event?.target) event.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            function getTourVenue(year) {
                const entry = tourYears.find(t => String(t.year) === String(year));
                return entry && typeof entry.venue === 'string' ? entry.venue.trim() : '';
            }

            function formatChampionshipTitle(year) {
                const venue = getTourVenue(year);
                return venue
                    ? `${year} LGA Championship — ${venue}`
                    : `${year} LGA Championship`;
            }

            function applyTourLocationPropagation() {
                renderHistoryMatrix();
                renderHandicapHistoryMatrix();
                renderYearBreakdown();
                populateCourseDropdowns();
                if (window.lucide) lucide.createIcons();
            }

            window.saveTourLocations = function() {
                tourYears = tourYears.map(t => {
                    const input = document.getElementById(`tour-loc-${t.year}`);
                    return {
                        year: t.year,
                        venue: (input?.value || '').trim()
                    };
                });
                applyTourLocationPropagation();
                pushSharedStateToCloud();
                closeTourLocationsModal();
                showToast('Tour locations updated across all corresponding sections.');
            };

            function populateCourseDropdowns() {
                const courses = getAllCourses();
                const activeTourVenues = tourYears
                    .map(t => (t.venue ? `${t.year}: ${t.venue}` : ''))
                    .filter(Boolean);
                const venueGroupHtml = activeTourVenues.length > 0
                    ? `<optgroup label="Assigned LGA Tour Venues">${activeTourVenues.map(v => {
                        const [yr, ...rest] = v.split(':');
                        const venueName = rest.join(':').trim();
                        const matchedCourse = courses.find(c => c.name.toLowerCase().includes(venueName.toLowerCase()));
                        const targetId = matchedCourse ? matchedCourse.id : (courses[0]?.id || 'c30');
                        return `<option value="${targetId}" data-tour-label="${venueName.replace(/"/g, '&quot;')}">${venueName} (${yr} Tour)</option>`;
                    }).join('')}</optgroup>`
                    : '';
                const optionsHtml = venueGroupHtml + courses.map(c =>
                    `<option value="${c.id}">${c.name} (${c.state} • Par ${c.par} / CR ${c.cr} / Slope ${c.slope})</option>`
                ).join('');

                ['course-select', 'course-card-select'].forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    const prev = el.value;
                    el.innerHTML = optionsHtml;
                    if (prev && Array.from(el.options).some(opt => opt.value === prev)) {
                        el.value = prev;
                    }
                });
            }

            function renderYearBreakdown() {
                const pillsEl = document.getElementById('year-selector-pills');
                const titleEl = document.getElementById('breakdown-title');
                const subtitleEl = document.getElementById('breakdown-location-subtitle');
                const contentEl = document.getElementById('year-breakdown-content');
                if (!pillsEl || !titleEl || !contentEl) return;

                pillsEl.innerHTML = tourYears.map(t => {
                    const active = t.year === selectedBreakdownYear;
                    return `
                        <button type="button" onclick="selectBreakdownYear('${t.year}')" class="px-2.5 py-1 rounded-lg font-mono text-xs font-bold transition cursor-pointer ${active ? 'bg-lga-navy text-lga-gold shadow' : 'bg-lga-sand text-lga-navy hover:bg-lga-gold/30'}">
                            ${t.year}
                        </button>
                    `;
                }).join('');

                const data = YEAR_BREAKDOWNS[selectedBreakdownYear] || YEAR_BREAKDOWNS['2025'];
                const currentVenue = getTourVenue(selectedBreakdownYear);
                titleEl.textContent = formatChampionshipTitle(selectedBreakdownYear);
                if (subtitleEl) {
                    if (currentVenue) {
                        subtitleEl.textContent = `Official Tour Location: ${currentVenue}`;
                        subtitleEl.classList.remove('hidden');
                    } else {
                        subtitleEl.textContent = '';
                        subtitleEl.classList.add('hidden');
                    }
                }

                if (!data || !Array.isArray(data.standings) || data.standings.length === 0) {
                    contentEl.innerHTML = `
                        <div class="p-6 rounded-xl bg-lga-sand/60 border border-lga-gold/25 text-center text-sm text-lga-slate">
                            No verified championship scorecard rows recorded for ${selectedBreakdownYear} yet.
                        </div>
                    `;
                    return;
                }

                contentEl.innerHTML = `
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-lga-navy text-white text-xs uppercase tracking-wider">
                                    <th class="py-2.5 px-3 rounded-tl-lg">Pos</th>
                                    <th class="py-2.5 px-3">Golfer</th>
                                    <th class="py-2.5 px-3">Hcp</th>
                                    <th class="py-2.5 px-3">Rd 1</th>
                                    <th class="py-2.5 px-3">Rd 2</th>
                                    <th class="py-2.5 px-3 rounded-tr-lg">Total</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-lga-sand">
                                ${data.standings.map((row, idx) => `
                                    <tr class="${idx === 0 ? 'bg-lga-gold/10 font-semibold' : 'hover:bg-lga-sand/40'}">
                                        <td class="py-2.5 px-3 font-mono">${idx === 0 ? '🏆 1' : (row.pos || idx + 1)}</td>
                                        <td class="py-2.5 px-3 text-lga-navy">${row.player}</td>
                                        <td class="py-2.5 px-3 font-mono">${row.hcp ?? '—'}</td>
                                        <td class="py-2.5 px-3 font-mono">${row.rd1 ?? '—'}</td>
                                        <td class="py-2.5 px-3 font-mono">${row.rd2 ?? '—'}</td>
                                        <td class="py-2.5 px-3 font-mono font-bold text-lga-navy">${row.total ?? '—'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            window.selectBreakdownYear = function(year) {
                selectedBreakdownYear = String(year);
                renderYearBreakdown();
            };
        })();
    </script>
</body>
</html>
